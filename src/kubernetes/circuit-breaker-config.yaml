# Istio Circuit Breaker для сервисов monolith и movies-service.
#
# connectionPool ограничивает число одновременных соединений и ожидающих
# запросов (при превышении Envoy сразу отвечает 503 — срабатывает circuit breaker),
# outlierDetection выкидывает из балансировки инстансы, возвращающие 5xx.
#
# Применение:
#   kubectl apply -f src/kubernetes/circuit-breaker-config.yaml -n cinemaabyss
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: movies-service-circuit-breaker
  namespace: cinemaabyss
spec:
  host: movies-service
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1
      http:
        http1MaxPendingRequests: 1
        maxRequestsPerConnection: 1
    outlierDetection:
      consecutive5xxErrors: 1
      interval: 1s
      baseEjectionTime: 3m
      maxEjectionPercent: 100
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: monolith-circuit-breaker
  namespace: cinemaabyss
spec:
  host: monolith
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: 1
      http:
        http1MaxPendingRequests: 1
        maxRequestsPerConnection: 1
    outlierDetection:
      consecutive5xxErrors: 1
      interval: 1s
      baseEjectionTime: 3m
      maxEjectionPercent: 100
